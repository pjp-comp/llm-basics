[project]
name = "llm-learn"
version = "0.1.0"
description = "Beginner-friendly phase-based LLM learning repo with Hugging Face examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "transformers>=4.44.0",
  "datasets>=2.19.0",
  "accelerate>=0.33.0",
  "peft>=0.11.0",
  "trl>=0.9.0",
  "bitsandbytes>=0.43.0",
  "sentencepiece>=0.2.0",
  "ollama>=0.3.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "torch>=2.4.0",
  "sentence-transformers>=5.7.0",
  "faiss-cpu>=1.15.0",
]

[tool.uv]
package = false
